name: Feature request
description: Something the mod could do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: What you'd see and do, if you have an idea of it.
